<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="TechSOS Bamako - Dépannage électronique rapide et certifié">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TechSOS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TechSOS - Dépannage Électronique Bamako</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #1F3A5F;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      position: fixed;
    }
    flutter-view {
      width: 100% !important;
      height: 100% !important;
    }
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #1F3A5F;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.3s ease-out;
    }
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .spinner {
      margin-top: 32px;
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #E8641C;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="logo-container">
      <!-- Logo vectoriel officiel TechSOS -->
      <svg width="84" height="84" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 8L82 22V52C82 72 68 88 50 94C32 88 18 72 18 52V22L50 8Z" fill="#162A45" stroke="#E8641C" stroke-width="4"/>
        <path d="M54 26L38 52H52L46 76L64 48H50L54 26Z" fill="#E8641C"/>
      </svg>
      <div style="color: white; font-size: 26px; font-weight: 800; margin-top: 16px; letter-spacing: 1px;">
        Tech<span style="color: #E8641C;">SOS</span>
      </div>
      <div style="color: #CBD5E1; font-size: 13px; margin-top: 6px; font-weight: 500;">
        Dépannage d'appareils électroniques · Bamako
      </div>
    </div>
    <div class="spinner"></div>
  </div>

  <script>
    function hideLoader() {
      var loader = document.getElementById('loading-screen');
      if (loader && loader.style.display !== 'none') {
        loader.style.opacity = '0';
        setTimeout(function () {
          try { loader.remove(); } catch (e) {}
        }, 300);
      }
    }
    window.addEventListener('flutter-first-frame', hideLoader);
    setTimeout(hideLoader, 2500);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
